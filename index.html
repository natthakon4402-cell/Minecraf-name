<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ปุ่มสวิตช์เปิดไฟแฟลช</title>
</head>
<body style="background-color: black; color: white; text-align: center; padding-top: 50px;">

    <h1>สวิตช์สั่งเปิดไฟแฟลชเครื่อง</h1>

    <!-- ปุ่มสั่งงาน -->
    <button onclick="toggleFlash()" style="font-size: 20px; padding: 15px 30px; cursor: pointer;">
        เปิด / ปิด ไฟแฟลช
    </button>

    <p id="status" style="color: yellow; margin-top: 20px;">สถานะ: ปิดอยู่</p>

    <script>
        let streamTrack = null; // ตัวแปรเก็บสายสัญญาณกล้อง
        let isFlashOn = false;  // ตัวแปรเช็กสถานะ ไฟเปิดหรือปิดอยู่

        async function toggleFlash() {
            try {
                // ถ้ายังไม่ได้ต่อกับกล้อง ให้ขออนุญาตใช้กล้องหลังก่อน
                if (!streamTrack) {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' } // ดึงกล้องหลังที่มีไฟแฟลช
                    });
                    streamTrack = stream.getVideoTracks()[0];
                }

                // สลับสถานะ ปิด -> เปิด หรือ เปิด -> ปิด
                isFlashOn = !isFlashOn;

                // สั่งเปิด/ปิด ไฟแฟลชจริง
                await streamTrack.applyConstraints({
                    advanced: [{ torch: isFlashOn }]
                });

                // อัปเดตข้อความบนหน้าจอ
                if (isFlashOn) {
                    document.getElementById('status').innerText = 'สถานะ: ไฟแฟลชเปิดอยู่! 💡';
                } else {
                    document.getElementById('status').innerText = 'สถานะ: ปิดอยู่';
                }

            } catch (err) {
                alert('เครื่องมึงไม่รองรับไฟแฟลช หรือไม่ได้เปิดอนุญาตกล้องว่ะไอ้นพ!');
            }
        }
    </script>

</body>
</html>
